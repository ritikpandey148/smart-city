<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup — SMART CITY</title>

  <link rel="icon" type="image/png" href="assets/images/smart-city-logo.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    * { font-family: 'Poppins', sans-serif; }
    body { margin: 0; background: #f0f1f3; overflow: hidden; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Card entrance */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(15px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-in { animation: cardIn 0.55s ease-out both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-1 { animation: fadeUp 0.4s ease-out 0.1s both; }
    .fade-2 { animation: fadeUp 0.4s ease-out 0.2s both; }
    .fade-3 { animation: fadeUp 0.4s ease-out 0.3s both; }

    /* Input focus ring */
    .input-wrap:focus-within {
      border-color: #E21B2D;
      box-shadow: 0 0 0 3px rgba(226, 27, 45, 0.12);
    }

    /* Logo blend */
    .smart-logo { mix-blend-mode: multiply; }

    /* Button hover */
    .btn-submit {
      transition: transform 0.25s cubic-bezier(.4,0,.2,1), background-color 0.25s, box-shadow 0.25s;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -8px rgba(226, 27, 45, 0.6);
    }

    /* ═══════ SEARCHABLE SELECT ═══════ */
    .ss-root { position: relative; }

    .ss-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 9px 13px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 42px;
    }
    .ss-trigger:hover { border-color: #9ca3af; }
    .ss-trigger.border-red-500 { border-color: #ef4444; }

    .ss-value {
      flex: 1;
      font-size: 13px;
      color: #343A40;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }
    .ss-placeholder-mode { color: #9ca3af; }

    .ss-arrow {
      transition: transform 0.25s;
      color: #9ca3af;
      flex-shrink: 0;
    }

    .ss-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.18);
      z-index: 60;
      max-height: 260px;
      overflow: hidden;
      animation: ssIn 0.18s ease-out;
    }
    @keyframes ssIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ss-panel.ss-open { display: flex; flex-direction: column; }

    .ss-search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-bottom: 1px solid #f1f3f5;
      background: #fafbfc;
    }
    .ss-search {
      flex: 1; outline: none; border: none;
      background: transparent; font-size: 13px; color: #343A40;
    }
    .ss-search::placeholder { color: #9ca3af; }

    .ss-options {
      overflow-y: auto;
      max-height: 200px;
      padding: 4px 0;
    }
    .ss-options::-webkit-scrollbar { width: 5px; }
    .ss-options::-webkit-scrollbar-thumb { background: #cbd0d6; border-radius: 10px; }

    .ss-option {
      padding: 8px 15px;
      font-size: 13px;
      color: #343A40;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ss-option:hover { background: #fff5f6; color: #E21B2D; }
    .ss-option.ss-selected {
      background: #E21B2D; color: #fff; font-weight: 500;
    }

    .ss-no-results {
      padding: 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    /* Gender pills */
    .gender-pill {
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }
    .gender-pill:hover:not(.active) { background: #e5e7eb; }

    ::selection { background: #E21B2D; color: white; }

    /* Hide scrollbar look */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd0d6; border-radius: 10px; }
  </style>
</head>

<body class="min-h-screen w-full flex items-center justify-center p-3 sm:p-4">

  <!-- Back Button -->
  <a href="index.html"
     class="fixed top-4 left-4 sm:top-5 sm:left-5 z-50 flex items-center gap-2
            bg-white/90 hover:bg-white backdrop-blur-md
            text-[#343A40] hover:text-[#E21B2D]
            font-medium text-[13px]
            px-3.5 py-2 rounded-full
            shadow-lg hover:shadow-xl
            transition-all duration-300 hover:-translate-x-1">
    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
    <span>Back</span>
  </a>

  <!-- Main Card -->
  <div class="card-in w-full max-w-[1080px] bg-white rounded-3xl
              shadow-[0_25px_70px_-20px_rgba(0,0,0,0.25)]
              overflow-hidden flex flex-col md:flex-row
              h-[96vh] max-h-[720px]">

    <!-- ═══ LEFT: City Image ═══ -->
    <div class="hidden md:block md:w-[38%] relative bg-cover bg-center"
         style="background-image: url('assets/images/login-bg.jpg');">
      <div class="absolute inset-0 bg-gradient-to-r from-transparent via-transparent to-white/10"></div>
    </div>

    <!-- ═══ RIGHT: Form ═══ -->
    <div class="w-full md:w-[62%] relative px-6 sm:px-8 md:px-10 py-5 md:py-6 flex flex-col justify-center overflow-y-auto">

      <!-- Skyline watermark (smaller, subtle) -->
      <img src="assets/images/skyline-fade.png" alt=""
           class="absolute bottom-0 left-0 right-0 w-full h-[80px] object-cover opacity-25 pointer-events-none select-none" />

      <div class="relative z-10 w-full">

        <!-- Logo (smaller) -->
        <div class="flex justify-center fade-1">
          <img src="assets/images/smart-city-logo.png" alt="SMART CITY"
               class="smart-logo w-20 sm:w-24 h-auto select-none" draggable="false" />
        </div>

        <!-- Tagline -->
        <p class="text-center mt-1 text-[11.5px] sm:text-[12px] text-[#4a5057] fade-2">
          Smart Citizen, <span class="text-[#E21B2D] font-semibold">Smart City</span>
        </p>

        <!-- Heading -->
        <h1 class="text-center mt-2.5 text-[20px] sm:text-[22px] font-bold text-[#1a1d21] fade-2">
          Create <span class="text-[#E21B2D]">Account</span>
        </h1>
        <p class="text-center mt-0.5 text-[11.5px] sm:text-[12px] text-[#6b7280] fade-2">
          Join us to make a cleaner and better city.
        </p>

        <!-- Top Error -->
        <div id="topError"
             class="hidden mt-3 fade-3 text-[12px] text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-center">
        </div>

        <!-- Form -->
        <form id="signupForm" class="mt-3.5 space-y-3 fade-3" novalidate>

          <!-- Row 1: First + Last Name -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="firstName" class="block text-[#1a1d21] font-semibold text-[11.5px] mb-1">First Name</label>
              <div class="input-wrap flex items-center gap-2 border border-gray-300 rounded-lg px-3 py-2 bg-white transition-all">
                <i data-lucide="user" class="w-3.5 h-3.5 text-gray-400 flex-shrink-0"></i>
                <input id="firstName" type="text" placeholder="First name"
                       class="flex-1 outline-none text-[13px] text-[#343A40] placeholder:text-gray-400 bg-transparent w-full min-w-0" />
              </div>
              <p id="firstNameError" class="hidden mt-0.5 text-[10.5px] text-red-600 font-medium"></p>
            </div>
            <div>
              <label for="lastName" class="block text-[#1a1d21] font-semibold text-[11.5px] mb-1">Last Name</label>
              <div class="input-wrap flex items-center gap-2 border border-gray-300 rounded-lg px-3 py-2 bg-white transition-all">
                <i data-lucide="user" class="w-3.5 h-3.5 text-gray-400 flex-shrink-0"></i>
                <input id="lastName" type="text" placeholder="Last name"
                       class="flex-1 outline-none text-[13px] text-[#343A40] placeholder:text-gray-400 bg-transparent w-full min-w-0" />
              </div>
              <p id="lastNameError" class="hidden mt-0.5 text-[10.5px] text-red-600 font-medium"></p>
            </div>
          </div>

          <!-- Row 2: Gender + Mobile -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[#1a1d21] font-semibold text-[11.5px] mb-1">Gender</label>
              <div class="flex gap-1.5" id="genderGroup">
                <button type="button" data-gender="Male"
                        class="gender-pill flex-1 py-2 rounded-lg text-[11.5px] font-medium bg-[#f0f1f3] text-[#343A40]">Male</button>
                <button type="button" data-gender="Female"
                        class="gender-pill flex-1 py-2 rounded-lg text-[11.5px] font-medium bg-[#f0f1f3] text-[#343A40]">Female</button>
                <button type="button" data-gender="Other"
                        class="gender-pill flex-1 py-2 rounded-lg text-[11.5px] font-medium bg-[#f0f1f3] text-[#343A40]">Other</button>
              </div>
              <p id="genderError" class="hidden mt-0.5 text-[10.5px] text-red-600 font-medium"></p>
            </div>
            <div>
              <label for="mobile" class="block text-[#1a1d21] font-semibold text-[11.5px] mb-1">Mobile Number</label>
              <div class="input-wrap flex items-center gap-2 border border-gray-300 rounded-lg px-3 py-2 bg-white transition-all">
                <i data-lucide="phone" class="w-3.5 h-3.5 text-gray-400 flex-shrink-0"></i>
                <input id="mobile" type="tel" maxlength="10" placeholder="10-digit mobile"
                       class="flex-1 outline-none text-[13px] text-[#343A40] placeholder:text-gray-400 bg-transparent w-full min-w-0" />
              </div>
              <p id="mobileError" class="hidden mt-0.5 text-[10.5px] text-red-600 font-medium"></p>
            </div>
          </div>

          <!-- Row 3: Locality + Pincode -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[#1a1d21] font-semibold text-[11.5px] mb-1">Select Locality</label>
              <div id="localitySelect" class="ss-root">
                <div class="ss-trigger">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5 text-gray-400 flex-shrink-0"></i>
                  <span class="ss-value ss-placeholder-mode">Select locality</span>
                  <i data-lucide="chevron-down" class="ss-arrow w-3.5 h-3.5"></i>
                </div>
                <div class="ss-panel">
                  <div class="ss-search-wrap">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400"></i>
                    <input type="text" class="ss-search" placeholder="Search locality..." />
                  </div>
                  <div class="ss-options"></div>
                </div>
                <input type="hidden" name="locality" />
              </div>
              <p id="localityError" class="hidden mt-0.5 text-[10.5px] text-red-600 font-medium"></p>
            </div>
            <div>
              <label class="block text-[#1a1d21] font-semibold text-[11.5px] mb-1">Pincode</label>
              <div id="pincodeSelect" class="ss-root">
                <div class="ss-trigger">
                  <i data-lucide="hash" class="w-3.5 h-3.5 text-gray-400 flex-shrink-0"></i>
                  <span class="ss-value ss-placeholder-mode">Select locality first</span>
                  <i data-lucide="chevron-down" class="ss-arrow w-3.5 h-3.5"></i>
                </div>
                <div class="ss-panel">
                  <div class="ss-search-wrap">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400"></i>
                    <input type="text" class="ss-search" placeholder="Search pincode..." />
                  </div>
                  <div class="ss-options"></div>
                </div>
                <input type="hidden" name="pincode" />
              </div>
              <p id="pincodeError" class="hidden mt-0.5 text-[10.5px] text-red-600 font-medium"></p>
            </div>
          </div>

          <!-- Row 4: Username -->
          <div>
            <label for="username" class="block text-[#1a1d21] font-semibold text-[11.5px] mb-1">Create Username</label>
            <div class="input-wrap flex items-center gap-2 border border-gray-300 rounded-lg px-3 py-2 bg-white transition-all">
              <i data-lucide="at-sign" class="w-3.5 h-3.5 text-gray-400 flex-shrink-0"></i>
              <input id="username" type="text" placeholder="Choose a username"
                     class="flex-1 outline-none text-[13px] text-[#343A40] placeholder:text-gray-400 bg-transparent w-full min-w-0" />
            </div>
            <p id="usernameError" class="hidden mt-0.5 text-[10.5px] text-red-600 font-medium"></p>
          </div>

          <!-- Row 5: Password -->
          <div>
            <label for="password" class="block text-[#1a1d21] font-semibold text-[11.5px] mb-1">Create Password</label>
            <div class="input-wrap flex items-center gap-2 border border-gray-300 rounded-lg px-3 py-2 bg-white transition-all">
              <i data-lucide="lock" class="w-3.5 h-3.5 text-gray-400 flex-shrink-0"></i>
              <input id="password" type="password" placeholder="Create a strong password"
                     class="flex-1 outline-none text-[13px] text-[#343A40] placeholder:text-gray-400 bg-transparent w-full min-w-0" />
              <button type="button" id="togglePassword"
                      class="text-gray-400 hover:text-[#E21B2D] transition-colors flex-shrink-0 p-0.5">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
              </button>
            </div>
            <p id="passwordError" class="hidden mt-0.5 text-[10.5px] text-red-600 font-medium"></p>
          </div>

          <!-- Submit Button (compact) -->
          <button type="submit" id="submitBtn"
                  class="btn-submit w-full flex items-center justify-center gap-2
                         bg-[#E21B2D] hover:bg-[#c41525]
                         text-white font-semibold text-[13.5px]
                         py-2.5 rounded-lg mt-1
                         shadow-[0_8px_20px_-8px_rgba(226,27,45,0.7)]">
            <span>Submit</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>

        </form>

        <!-- Back to login -->
        <p class="text-center text-[11.5px] text-[#6b7280] mt-2.5 fade-3">
          Already have an account?
          <a href="login.html" class="text-[#E21B2D] hover:underline font-semibold ml-1">Login</a>
        </p>

      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/locality.js"></script>
  <script src="js/signup.js"></script>
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
